services:
  postgres:
    image: postgres:16-alpine
    container_name: anastaria-postgres
    restart: always
    environment:
      POSTGRES_DB: openmu
      POSTGRES_USER: anastaria
      POSTGRES_PASSWORD: AnastariaSecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: anastaria-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
